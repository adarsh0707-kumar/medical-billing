services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # No VITE_API_URL: the SPA calls /api on its own origin. This is where the
      # dev server forwards those calls.
      - VITE_PROXY_TARGET=http://backend:5000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    # Bring the schema up before serving. Nothing else in this stack applied the
    # migrations, so a fresh clone following the README got an empty database:
    # `docker compose up -d` succeeded, `npm run seed` failed with P2021 "table
    # public.User does not exist" — and, until it was given an exit code, said
    # nothing about it — and every request 500'd against a schema that was never
    # created. It worked only on machines whose pgdata volume predated the
    # problem, which is the shape of a bug that survives for months.
    #
    # `migrate deploy`, not `migrate dev`: it applies committed migrations and
    # never generates or resets one. Idempotent, so restarts are free.
    command: sh -c "npx prisma migrate deploy && npm run dev"
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://medadmin:medpass123@postgres:5432/medicaldb
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: medadmin
      POSTGRES_PASSWORD: medpass123
      POSTGRES_DB: medicaldb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medadmin -d medicaldb"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
