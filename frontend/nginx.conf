# Serves the built SPA inside the frontend container. The edge proxy
# (nginx/nginx.prod.conf) terminates TLS and sets the security headers; this
# file's only jobs are static serving and client-side routing.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed filenames, so a given asset URL never changes
    # meaning. Cache them hard.
    location /assets/ {
        # One Cache-Control header, not two: `expires` emits its own, and pairing
        # it with add_header sends the directive twice.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        # The entry point must never be cached, or a browser keeps loading the
        # old bundle after a deploy and requests assets that no longer exist.
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Client-side routing. Without this fallback, a reload on /billing or a
    # pasted deep link asks nginx for a file that does not exist and gets a 404 —
    # the app only ever works if you enter through /.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Font files are already compressed; gzipping them wastes CPU for nothing.

    server_tokens off;
}
