# Render Blueprint. Must live at the repository root — Render does not look for
# it in subdirectories — and every path below is resolved from the root too.
#
# NOTE: applying this creates a NEW service and database. It does not adopt the
# service already running in the dashboard. See the region comment before use.
services:
  - type: web
    name: medical-billing-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Must match the database's region, or the internal hostname will not
    # resolve and the app will fail with Prisma P1001.
    region: oregon
    plan: free
    # Applies the 16 migrations in backend/prisma/migrations before traffic is
    # sent. The Dockerfile deliberately keeps the prisma CLI so this can run.
    preDeployCommand: npx prisma migrate deploy
    # Express serves no route at /, so the default probe of / returns 404.
    # /health is a static 200; /health/ready touches the database and would
    # take the service out of rotation on a transient DB blip.
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medical-billing-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # CORS origin allow-list (src/app.js). Comma-separated origins, e.g.
      # https://medical-billing.vercel.app
      #
      # Must be CORS_ORIGINS, not FRONTEND_URL. app.js reads FRONTEND_URL only
      # on the development branch; under the NODE_ENV=production set above, the
      # allowlist is exactly this variable. Setting the other one permitted
      # nothing at all.
      - key: CORS_ORIGINS
        sync: false
      # Which peers may set X-Forwarded-For, and therefore what the rate limiter
      # keys on. Stated rather than left to the default, because the failure is
      # silent: if Render's edge reaches the container from an address outside
      # these ranges, express-rate-limit keys every request to the proxy and the
      # per-client budget of 500 requests / 15 min becomes a shop-wide one.
      #
      # Render routes to services over its private network, which is RFC 1918 —
      # covered by `uniquelocal`. Verify on the running service rather than
      # trusting this comment: the readiness log line carries the resolved
      # req.ip, and it should be the caller's address, not 10.x.
      - key: TRUST_PROXY
        value: "loopback, linklocal, uniquelocal"

databases:
  - name: medical-billing-db
    plan: free
    region: oregon
