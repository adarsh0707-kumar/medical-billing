services:
  - type: web
    name: medical-billing-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    preDeployCommand: npx prisma migrate deploy
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: medical-billing-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
databases:
  - name: medical-billing-db
