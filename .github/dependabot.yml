# Dependency updates.
#
# The audit job in ci.yml is the alarm; this is the thing that answers it. An
# alarm with no remedy behind it just goes red and stays red until somebody
# disables it, which is how dependency hygiene usually dies.
#
# Weekly, not daily. This is a two-person project and a pull request nobody has
# time to read is not an improvement. Security advisories are handled separately
# by Dependabot's security updates (enabled in the repository's settings, not
# here) and arrive as soon as they are published, whatever this schedule says.
#
# Updates are grouped so an ordinary week produces two or three reviewable pull
# requests instead of twenty. Major versions are deliberately left ungrouped:
# React 19 → 20 or Prisma 5 → 6 deserves its own PR, its own test run, and
# someone reading the changelog.

version: 2

updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Prisma majors are not raised automatically any more, because the same
    # one has now broken production twice.
    #
    # Prisma 7 is not a version bump for this codebase. It drops the datasource
    # `url`, renames the prisma-client-js generator and requires a driver
    # adapter — so the pull request is green on Dependabot's side, unbuildable
    # on ours, and the breakage only shows at deploy. Both times it also
    # arrived with a merge that left package-lock.json unparseable, which is
    # the failure the deploy actually reported.
    #
    # This blocks **majors only**. A 5.x patch or minor — including a security
    # patch, which Dependabot raises on its own schedule — still comes through
    # untouched. The upgrade is real work that wants a branch and a test run
    # against a real database, not a merge button on a Monday.
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(backend)"
    labels: ["dependencies", "backend"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # TypeScript majors are not raised here, because this one has now broken
    # the Vercel deploy twice.
    #
    # The blocker is not our code — the app type-checks, lints and builds under
    # TypeScript 7. It is `typescript-eslint`, whose peer range is still
    # `>=4.8.4 <6.1.0` at 8.69.0, the current latest, with no 9.x published.
    # So `npm install` cannot resolve the tree at all, and there is no forward
    # fix to take: the only options are reverting the major or hiding the
    # conflict with --legacy-peer-deps, which is what let it reach a deploy the
    # first time.
    #
    # Majors only. Patches and minors, security patches included, still arrive.
    # **Remove this rule when typescript-eslint publishes a peer range that
    # admits TypeScript 7** — that is the single condition, and it is checkable
    # in one command: `npm view typescript-eslint peerDependencies.typescript`.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(frontend)"
    labels: ["dependencies", "frontend"]

  # The workflows pin actions/checkout@v4 and friends. A stale action is a
  # supply-chain dependency like any other, and it is the one nobody thinks to
  # look at.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencies", "ci"]
