name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          # The suite refuses to run unless the database name ends in _test.
          POSTGRES_DB: medicaldb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/medicaldb_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-real
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate

      # The suite's global setup applies migrations itself; running it here too
      # keeps a schema failure separate from a test failure in the log.
      - run: npx prisma migrate deploy

      # Coverage rather than plain `npm test`: the config gates the invoice
      # controller and the auth middleware at 90%.
      - run: npm run test:coverage

  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --legacy-peer-deps
      - run: npm run lint

      # Unit tests before the build: they are seconds, and the cart-maths cases
      # are the guard on G-17, where the client and server must round identically.
      - run: npm test

      # tsc -b runs as part of the build and catches type errors lint does not.
      - run: npm run build

  # Its own job: the browser download costs about a minute, and the smoke needs
  # the whole stack up. Keeping it separate leaves lint, unit tests and the
  # backend suite as the fast signal on every push.
  e2e:
    name: Browser smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start the stack
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" > .env
          docker compose up -d --wait

      - name: Seed the bootstrap admin
        run: docker compose exec -T backend npm run seed

      - name: Wait for the app to answer through nginx
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost; then echo "up"; exit 0; fi
            sleep 2
          done
          echo "nginx never became ready"; docker compose logs; exit 1

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the smoke suite
        working-directory: frontend
        run: npm run test:e2e

      - name: Collect the stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
