# Edge proxy for the production stack. Terminates TLS, sets the security
# headers, and puts the SPA and the API on one origin so the browser never makes
# a cross-origin request.
#
# The development config is nginx/nginx.conf, which proxies to the Vite dev
# server over plain HTTP. This one proxies to the built static files.

# Everything on :80 is a redirect. Nothing is served over plain HTTP.
server {
    listen 80;
    server_name _;

    # Kept reachable so an ACME http-01 challenge can be added later without
    # restructuring: a certbot webroot location would go here.

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ─── Security headers ─────────────────────────────────────────────────────
    # nginx/README.md claimed these for months while the config had none of them.
    #
    # HSTS is deliberately without `preload`: preloading is close to irreversible,
    # and that is an operator's decision on a real domain, not a default.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # CSP: the SPA loads only its own bundle and talks only to its own origin.
    # 'unsafe-inline' on style-src is required by Tailwind's runtime style
    # injection and by the inline styles shadcn components emit; script-src has
    # no such escape, which is the half that matters.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    server_tokens off;

    # An invoice PDF or a bulk import should not be cut off at nginx's default 1M.
    client_max_body_size 10m;

    # ─── API ──────────────────────────────────────────────────────────────────
    location /api {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Missing from the development config. Without it the API believes every
        # request arrived over plain HTTP, which breaks any absolute URL it
        # builds and any secure-cookie decision it later makes.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout   60s;
        proxy_read_timeout   60s;
    }

    # The API's own health endpoint, reachable without the /api prefix.
    location = /health {
        proxy_pass http://backend:5000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ─── SPA ──────────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
}
